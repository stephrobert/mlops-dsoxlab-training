# Configuration CodeQL du catalogue MLOps.
#
# POURQUOI CE FICHIER EXISTE
#
# Le `ci.yml` de ce depot le REFERENCE. Sans lui, les deux jobs CodeQL
# echouent sur « The configuration file .github/codeql/config.yml does not
# exist », et le chemin est le piege : il vit sous `.github/codeql/` et non
# `.github/codeql-config.yml`.
#
# CE QU'IL EXCLUT, MESURE SUR CE DEPOT
#
# Les corriges de reference, et eux seuls : les HUIT sont chiffres par
# ansible-vault, donc CodeQL n'en lirait rien d'exploitable.
#
# `labs/**/fixtures/` est EXCLU aussi, et c'est propre a ce catalogue :
# ses sept labs sont de runtime `shell`, et leurs fixtures sont le point
# de depart livre tel quel a l'apprenant. Les linter reviendrait a
# corriger ce que le lab demande de corriger.
#
# CE QUI RESTE ANALYSE
#
#   .github/workflows/        les workflows du catalogue lui-meme
#   scripts/                  l'outillage de validation
#   tests/                    les garde-fous du depot
#   labs/**/challenge/tests/  les tests joues sur le poste de l'apprenant
name: "Catalogue MLOps, hors solutions chiffrees"

paths-ignore:
  # Huit corriges chiffres par ansible-vault, au 2026-10-23.
  - "solution/**"
  # Le point de depart de l'apprenant, livre tel quel.
  - "labs/**/fixtures/**"
