# yaml-language-server: $schema=https://raw.githubusercontent.com/stephrobert/dsoxlab/main/schemas/lab.schema.json
id: m1-projet-reproductible
title: "Make a training run reproducible"
description: |
  A colleague's training script gives different metrics on every run, and
  nobody knows which library versions it needs. Find where the variation comes
  from, pin it, and prove it: two trainings give the same metrics. Graded on
  the real state of the project (versioned files, lock, data fingerprint,
  metrics), never on the commands typed.
section: m1-reproduire
level: m1
lab_type: lab
difficulty: beginner
estimated_time: "30m"
skills:
  - ml-reproductibilite
  - uv
  - git
distros:
  - any
doc_url: https://www.stephane-robert.info/docs/mlops/projet-reproductible/
runtime:
  type: shell
  workdir: challenge/work
  fixtures:
    - train.py
    - genere-metriques.py
validation:
  functional: true
  security: false
  persistence_after_reboot: false
