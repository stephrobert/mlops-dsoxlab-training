# yaml-language-server: $schema=https://raw.githubusercontent.com/stephrobert/dsoxlab/main/schemas/lab.schema.json
id: m1-tests-modele
title: "Refuse a worse model and broken data with pytest"
description: |
  A model is promoted because its metric looks fine, on data nobody checked.
  Write a pytest suite that checks the data (schema, bounds) and the model
  (a metric threshold read from a versioned file, a comparison with the
  champion), and that fails on a broken dataset and on a worse model. Graded
  by replaying your suite on datasets and models the check builds itself,
  never on the commands typed.
section: m1-reproduire
level: m1
lab_type: lab
difficulty: intermediate
estimated_time: "40m"
skills:
  - pytest
  - ml-reproductibilite
  - uv
distros:
  - any
doc_url: https://blog.stephane-robert.info/docs/mlops/tests-modele/
runtime:
  type: shell
  workdir: challenge/work
  fixtures:
    - .gitignore
    - pyproject.toml
    - params.yaml
    - train.py
    - genere-metriques.py
    - casse-schema.csv
    - casse-bornes.csv
validation:
  functional: true
  security: false
  persistence_after_reboot: false
