# yaml-language-server: $schema=https://raw.githubusercontent.com/stephrobert/dsoxlab/main/schemas/lab.schema.json
id: m1-dvc-pipeline
title: "Replay a training with a DVC pipeline"
description: |
  Data generation and training are two scripts run by hand, in an order
  nobody wrote down. Describe them as a DVC pipeline, replay it on a clean
  clone and get the same metrics, then check that changing one parameter
  only replays the stage it touches. Graded on dvc.yaml, the bucket, the
  metrics and what DVC really reruns, never on the commands typed.
section: m1-reproduire
level: m1
lab_type: lab
difficulty: intermediate
estimated_time: "40m"
skills:
  - dvc
  - ml-reproductibilite
  - uv
distros:
  - any
doc_url: https://blog.stephane-robert.info/docs/mlops/pipeline-dvc/
runtime:
  type: shell
  workdir: challenge/work
  fixtures:
    - .gitignore
    - pyproject.toml
    - params.yaml
    - train.py
    - genere-metriques.py
validation:
  functional: true
  security: false
  persistence_after_reboot: false
