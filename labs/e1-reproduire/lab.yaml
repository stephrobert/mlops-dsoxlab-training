# yaml-language-server: $schema=https://raw.githubusercontent.com/stephrobert/dsoxlab/main/schemas/lab.schema.json
id: e1-reproduire
title: "Exam: make a model reproducible and traceable"
description: |
  You receive the starting repository of the thread: a data generator, a
  training script and its parameters, and nothing else. Deliver a model
  anyone can rebuild and trace: versioned data in the S3 store, a pipeline
  that replays to the same metric on a fresh clone, a run on the MLflow
  server that carries the commit and the data fingerprint, the model
  registered with the alias challenger, and a pytest suite that refuses the
  two broken datasets provided, a model above the metric threshold and a
  candidate worse than the champion. Graded as
  a black box on the state of the repository and of the servers, without
  hints.
section: level-exams
level: m1
difficulty: intermediate
lab_type: challenge
exam_passing_score: 70
estimated_time: 45m
skills:
  - dvc
  - mlflow
  - pytest
  - ml-reproductibilite
  - uv
distros:
  - any
doc_url: https://blog.stephane-robert.info/docs/mlops/epreuve-reproduire/
runtime:
  type: shell
  workdir: challenge/work
  # Le point de depart : le depot du fil rouge en bundle, deux jeux casses a
  # refuser (schema, bornes) et les metriques du champion de reference.
  fixtures:
    - depot.bundle
    - casse-schema.csv
    - casse-bornes.csv
    - metrics-champion.json
validation:
  functional: true
  security: false
  persistence_after_reboot: false
